<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Activity Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#2196f3">

  <!-- Tema condiviso -->
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js" defer></script>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root{ --radius:12px; --pad:14px; --maxw:840px; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg); color:var(--text);
    }

    /* Header */
    header{
      position:sticky; top:0; z-index:50;
      padding:12px 16px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:10px; background:var(--bg);
    }
    header h1{ margin:0; font-size:18px; font-weight:800 }
    .right{ margin-left:auto; display:flex; gap:8px; align-items:center }
    .btn{ min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); cursor:pointer; font-size:14px }
    .btn.primary{ background:var(--link); border-color:var(--link); color:#fff }
    a.link-btn{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; background:var(--link); color:#fff; padding:8px 10px; border-radius:10px; text-decoration:none; font-size:14px }

    /* Layout main */
    .container{ width:100%; max-width:var(--maxw); margin:0 auto; padding:var(--pad); padding-bottom:88px; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px }
    .title{ margin:0 0 8px; font-size:16px; font-weight:800 }
    .mini{ font-size:12px; color:var(--muted) }
    .inline{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }

    input, select{
      width:100%; min-height:44px; padding:12px; margin:6px 0;
      font-size:16px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text)
    }
    .row{ display:flex; gap:8px; flex-wrap:wrap }
    .row > *{ flex:1 1 220px }

    /* Pill login minimale */
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; font-size:14px; background:transparent }
    .logout{ cursor:pointer }

    /* Toast centrale */
    .toast{ position:fixed; inset:0; display:none; place-items:center; z-index:80; padding:16px }
    .toast.show{ display:grid }
    .toast .box{ background:var(--toast); color:var(--toastText); padding:12px 16px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.25) }
    .toast .ok{ margin-left:8px; border:1px solid rgba(255,255,255,.2); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px; background:transparent; color:inherit }

    /* Tabella ultimi 5 */
    .table-wrap{ overflow:auto; -webkit-overflow-scrolling:touch; border-radius:10px; border:1px solid var(--line); }
    table{ width:100%; border-collapse:collapse; min-width:560px; background:transparent }
    th, td{ border-bottom:1px solid var(--line); padding:10px 8px; font-size:14px; vertical-align:middle; }
    th{ background:transparent; text-align:left; position:sticky; top:0; }
    .actions{ white-space:nowrap }
    .sm{ min-height:36px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); cursor:pointer; font-size:13px }
    .sm.danger{ border-color:#ffb3c1; color:#ff2d55 }
    .sm.primary{ background:var(--link); border-color:var(--link); color:#fff }

    /* Pannello tag/categorie */
    .panel{ display:none; padding:10px; border:1px dashed var(--line); border-radius:10px; background:transparent; margin-top:6px }
    .panel.show{ display:block }
    .maplist{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px }
    .pill2{ border:1px solid var(--line); border-radius:999px; padding:6px 10px; font-size:12px }

    /* Modale edit */
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:90; padding:16px }
    .overlay.show{ display:flex }
    .modal{ width:min(520px,92vw); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px }
    .modal h3{ margin:0 0 8px }
    .btns{ display:flex; gap:8px; justify-content:flex-end }

    /* Bottom Action Bar (mobile) */
    .actionbar{
      position:fixed; left:0; right:0; bottom:0; z-index:60;
      padding:10px max(env(safe-area-inset-left,16px),16px) calc(10px + env(safe-area-inset-bottom,0));
      background:var(--bg); border-top:1px solid var(--line); display:flex; gap:8px;
    }
    .actionbar .btn, .actionbar .link-btn{ flex:1; justify-content:center; }

    /* Spaziature + desktop tweaks */
    @media (min-width:900px){
      .container{ padding-bottom:20px; }
      .actionbar{ display:none; }
    }
  </style>
</head>
<body>
<header>
  <h1>Activity Tracker</h1>
  <div class="right">
    <!-- Toggle tema top-right (theme.js gestisce l’icona) -->
    <button id="themeBtn" class="btn" title="Tema">🌙</button>

    <!-- Pill login minimal -->
    <span id="userPill" class="pill" style="display:none">
      <span id="userLabel">—</span>
      <span id="logoutBtn" class="logout" title="Logout">🚪</span>
    </span>

    <!-- Link desktop a Statistiche (su mobile c’è anche nella barra in basso) -->
    <a class="link-btn" href="statistics.html">📊 Statistiche</a>
  </div>
</header>

<div class="container">
  <!-- Auth -->
  <div id="authBox" class="card">
    <div class="title">Accedi</div>
    <div class="row">
      <input id="email" type="email" placeholder="Email" autocomplete="email" inputmode="email">
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="row">
      <button id="loginBtn" class="btn">Accedi</button>
      <button id="signupBtn" class="btn">Registrati</button>
    </div>
    <div class="mini">Devi essere loggato per inserire attività.</div>
  </div>

  <!-- App -->
  <div id="appBox" class="card" style="display:none">
    <div class="inline" style="justify-content:space-between">
      <div class="inline">
        <div class="title" style="margin:0">📥 Inserisci</div>
        <span id="gearOpen" class="gear" title="Gestisci tag e categorie">⚙︎</span>
      </div>
      <div class="mini">Ultima attività: <b id="lastActivity">—</b></div>
    </div>

    <input type="text" id="activity" placeholder="Attività…" inputmode="text">
    <div class="row">
      <input type="datetime-local" id="dateTime">
      <select id="tag"></select>
    </div>
    <!-- Bottone “Aggiungi” anche dentro la card (utile su desktop) -->
    <button id="addBtn" class="btn primary">➕ Aggiungi</button>
  </div>

  <!-- Pannello tag/categorie -->
  <div id="gearPanel" class="panel" aria-hidden="true">
    <div class="row">
      <input id="newTagName" placeholder="Nuovo tag (es. Nut)" inputmode="text">
      <select id="newTagCat">
        <option value="good">Produttivo</option>
        <option value="neutral">Neutro</option>
        <option value="bad">Spreco</option>
        <option value="non">Non gestibile</option>
      </select>
      <button id="addTagBtn" class="btn primary">Aggiungi/aggiorna</button>
      <button id="resetMapBtn" class="btn" style="border-color:#ffb3c1; color:#ff2d55">Reset mappature</button>
    </div>
    <div class="mini">Tag disponibili (menu a tendina) + mappature locali (usate nelle statistiche):</div>
    <div class="maplist" id="tagListBox"></div>
  </div>

  <!-- Ultimi 5 -->
  <div id="listBox" class="card" style="display:none">
    <div class="title">Ultimi 5</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Ora</th><th>Tag</th><th>Attività</th><th class="actions">Azioni</th></tr></thead>
        <tbody id="activityList"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bottom Action Bar (mobile) -->
<div class="actionbar">
  <button id="addBtnBottom" class="btn primary">➕ Aggiungi</button>
  <a class="link-btn" href="statistics.html">📊 Statistiche</a>
</div>

<!-- Toast -->
<div class="toast" id="toast" aria-live="polite" aria-atomic="true">
  <div class="box">
    <span id="toastMsg">Salvato</span>
    <button class="ok" onclick="document.getElementById('toast').classList.remove('show')">OK</button>
  </div>
</div>

<!-- Modale edit -->
<div id="editOverlay" class="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h3 id="editTitle">✏️ Modifica</h3>
    <input type="text" id="editActivity" placeholder="Attività…" inputmode="text">
    <div class="row">
      <input type="datetime-local" id="editDateTime">
      <select id="editTag"></select>
    </div>
    <div class="btns">
      <button id="cancelEditBtn" class="btn">Annulla</button>
      <button id="deleteEditBtn" class="btn" style="border-color:#ffb3c1; color:#ff2d55">Elimina</button>
      <button id="saveEditBtn" class="btn primary">Salva</button>
    </div>
  </div>
</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDEq8aUhdBPcjYM6H6909DldXAdjhRNWbI",
  authDomain: "time-ff7ed.firebaseapp.com",
  projectId: "time-ff7ed",
  storageBucket: "time-ff7ed.appspot.com",
  messagingSenderId: "842285944784",
  appId: "1:842285944784:web:de483548153abc956033d5",
  measurementId: "G-ZR0BNWGVXJ"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

/* ================= Tag + categorie (local) ================= */
const TAGS_KEY='tt_custom_tags';
const MAP_KEY ='tt_custom_tag_map';
const DEFAULT_TAGS = ["Entertainment","Survive","Study","Work","Nut","Slavery","Productivity","Waste","Chess","Gym","Bike","Holiday","Chinese","Sleep","Book"];
let NON_G=['Sleep','Work','Survive','Slavery'], GOOD=['Study','Productivity','Book','Chinese','Gym','Bike','Chess'], NEUT=['Entertainment','Holiday','Nut'], WAST=['Waste'];
const loadJSON=(k,f)=>{ try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f));}catch{return f;} };
const saveJSON=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let customTags = loadJSON(TAGS_KEY, DEFAULT_TAGS);
let tagMap     = loadJSON(MAP_KEY, {});
function tagCategory(tag){ const t=String(tag||'').trim(); if(tagMap[t]) return tagMap[t]; if(NON_G.includes(t)) return 'non'; if(GOOD.includes(t)) return 'good'; if(WAST.includes(t)) return 'bad'; if(NEUT.includes(t)) return 'neutral'; return 'neutral'; }

/* ================= Helpers ================= */
const $ = s=>document.querySelector(s);
function toast(msg){ $('#toastMsg').textContent=msg; $('#toast').classList.add('show'); setTimeout(()=>$('#toast').classList.remove('show'), 1800); }
function getLocalISODateTimeNow(){ const now=new Date(); now.setSeconds(0,0); const tz=-now.getTimezoneOffset(); return new Date(now.getTime()+tz*60000).toISOString().slice(0,16); }
function userCol(uid){ return db.collection(`users/${uid}/activities`); }
function buildTagSelects(){ const sel=$('#tag'); sel.innerHTML=''; const sel2=$('#editTag'); sel2.innerHTML=''; customTags.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o.cloneNode(true)); sel2.appendChild(o); }); }
function renderTagListBox(){ const box=$('#tagListBox'); box.innerHTML=''; customTags.forEach(t=>{ const cat=tagCategory(t); const color=cat==='good'?'var(--good)':cat==='bad'?'var(--bad)':cat==='non'?'#8b5cf6':'var(--neutral)'; const el=document.createElement('span'); el.className='pill2'; el.style.borderColor=color; el.style.color=color; el.textContent=`${t} → ${cat}`; box.appendChild(el); }); }

/* ================= Stato ================= */
let currentUid=null, unsubLatest=null, currentEditId=null;

/* ================= Auth UI ================= */
function setLoggedUI(user){
  const show = v => v?'':'none';
  $('#authBox').style.display = show(!user);
  $('#appBox').style.display  = show(!!user);
  $('#listBox').style.display = show(!!user);
  $('#userPill').style.display= user?'inline-flex':'none';
  if (user){
    $('#userLabel').textContent = user.email || user.uid;
    if (!$('#dateTime').value) $('#dateTime').value=getLocalISODateTimeNow();
  }
}
auth.onAuthStateChanged(u=>{
  if (!u){ setLoggedUI(null); return; }
  currentUid=u.uid; setLoggedUI(u); buildTagSelects(); renderTagListBox(); watchLastActivity(); watchLatest5();
});
$('#loginBtn').onclick=async()=>{ const email=$('#email').value.trim(), pass=$('#pass').value; if(!email||!pass) return toast('Inserisci email e password'); try{ await auth.signInWithEmailAndPassword(email,pass); toast('Benvenuto!'); }catch(e){ console.error(e); toast(e.message); } };
$('#signupBtn').onclick=async()=>{ const email=$('#email').value.trim(), pass=$('#pass').value; if(!email||!pass) return toast('Inserisci email e password'); try{ await auth.createUserWithEmailAndPassword(email,pass); await auth.currentUser.sendEmailVerification(); toast('Registrazione ok. Verifica email.'); }catch(e){ console.error(e); toast(e.message); } };
$('#logoutBtn').onclick=async()=>{ if(!confirm('Sei sicuro di voler uscire?')) return; await auth.signOut(); };

/* ================= Inserimento ================= */
$('#activity').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#addBtn').click(); });
$('#activity').addEventListener('focus', ()=>{ if(!$('#dateTime').value) $('#dateTime').value=getLocalISODateTimeNow(); });
$('#dateTime').addEventListener('focus', function(){ if(!this.value) this.value=getLocalISODateTimeNow(); });

async function doAdd(){
  const u=auth.currentUser; if(!u) return toast('Devi essere loggato');
  const activity=$('#activity').value.trim(); const tag=$('#tag').value;
  let dateTime=$('#dateTime').value||getLocalISODateTimeNow();
  if(!activity||!tag) return toast('Inserisci attività e tag');
  try{
    await userCol(u.uid).add({ activity, tag, timestamp: dateTime });
    $('#activity').value=''; $('#dateTime').value='';
    toast('Attività salvata');
  }catch(e){ console.error(e); toast('Errore: '+e.message); }
}
$('#addBtn').onclick = doAdd;
$('#addBtnBottom').onclick = ()=>{ // bottone barra mobile
  doAdd();
  // scroll su “Ultimi 5” per feedback immediato
  setTimeout(()=>document.getElementById('listBox').scrollIntoView({behavior:'smooth'}), 250);
};

/* ================= Ultima attività ================= */
function watchLastActivity(){
  if(!currentUid) return;
  userCol(currentUid).orderBy('timestamp','desc').limit(1).onSnapshot(snap=>{
    let txt='—';
    snap.forEach(d=>{
      const t=new Date(d.data().timestamp);
      const dd=t.toLocaleDateString('it-IT',{ timeZone:'Europe/Rome' });
      const hh=t.toLocaleTimeString('it-IT',{ timeZone:'Europe/Rome', hour12:false });
      txt=`${dd} ${hh}`;
    });
    $('#lastActivity').textContent=txt;
  });
}

/* ================= Ultimi 5 (realtime) ================= */
function watchLatest5(){
  if (unsubLatest) { unsubLatest(); unsubLatest=null; }
  unsubLatest = userCol(currentUid).orderBy('timestamp','desc').limit(5).onSnapshot(snap=>{
    const tbody=$('#activityList'); tbody.innerHTML='';
    snap.forEach(doc=>{
      const d=doc.data(); const t=new Date(d.timestamp);
      const localDate=t.toLocaleDateString('it-IT',{ timeZone:'Europe/Rome' });
      const localTime=t.toLocaleTimeString('it-IT',{ timeZone:'Europe/Rome', hour12:false });
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${localDate}</td><td>${localTime}</td><td>${d.tag||''}</td><td>${d.activity||''}</td>
      <td class="actions"><button class="sm" onclick="openEdit('${doc.id}')">✏️</button>
      <button class="sm danger" onclick="deleteActivity('${doc.id}')">🗑️</button></td>`;
      tbody.appendChild(tr);
    });
  });
}

/* ================= Modifica / Cancella ================= */
function toInputDT(str){ return (str||'').slice(0,16); }
async function openEdit(id){
  currentEditId=id; const u=auth.currentUser; if(!u) return;
  const snap=await userCol(u.uid).doc(id).get();
  if (!snap.exists) return toast('Documento non trovato');
  const d=snap.data();
  $('#editActivity').value=d.activity||'';
  $('#editDateTime').value=toInputDT(d.timestamp||'');
  buildTagSelects(); $('#editTag').value=d.tag||'';
  $('#editOverlay').classList.add('show'); $('#editOverlay').setAttribute('aria-hidden','false');
}
function closeEdit(){ currentEditId=null; $('#editOverlay').classList.remove('show'); $('#editOverlay').setAttribute('aria-hidden','true'); }
document.getElementById('cancelEditBtn').onclick=closeEdit;

document.getElementById('saveEditBtn').onclick=async()=>{
  const u=auth.currentUser; if(!u||!currentEditId) return;
  const activity=$('#editActivity').value.trim();
  const timestamp=$('#editDateTime').value;
  const tag=$('#editTag').value;
  if(!activity||!timestamp||!tag) return toast('Compila tutti i campi');
  try{
    await userCol(u.uid).doc(currentEditId).update({ activity, timestamp, tag });
    closeEdit(); toast('Salvato');
  }catch(e){ console.error(e); toast('Errore: '+e.message); }
};
document.getElementById('deleteEditBtn').onclick=async()=>{
  const u=auth.currentUser; if(!u||!currentEditId) return;
  if(!confirm('Eliminare definitivamente questa attività?')) return;
  try{
    await userCol(u.uid).doc(currentEditId).delete();
    closeEdit(); toast('Eliminato');
  }catch(e){ console.error(e); toast('Errore: '+e.message); }
};

/* ================= Pannello tag/categorie ================= */
document.getElementById('gearOpen').onclick=()=>{
  const p=$('#gearPanel'); const open=!p.classList.contains('show');
  p.classList.toggle('show', open);
  p.setAttribute('aria-hidden', open?'false':'true');
  buildTagSelects(); renderTagListBox();
};
document.getElementById('addTagBtn').onclick=()=>{
  const name=String($('#newTagName').value||'').trim();
  const cat=$('#newTagCat').value;
  if(!name) return toast('Inserisci un nome tag');
  if(!customTags.includes(name)){ customTags.push(name); customTags.sort(); saveJSON(TAGS_KEY, customTags); }
  tagMap[name]=cat; saveJSON(MAP_KEY, tagMap);
  buildTagSelects(); renderTagListBox();
  toast(`Tag "${name}" aggiunto (${cat})`);
  $('#newTagName').value='';
};
document.getElementById('resetMapBtn').onclick=()=>{
  if(!confirm('Cancellare tutte le mappature personalizzate?')) return;
  tagMap={}; saveJSON(MAP_KEY, tagMap);
  renderTagListBox(); toast('Mappature resettate');
};

/* ================= Service Worker (facoltativo) ================= */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
