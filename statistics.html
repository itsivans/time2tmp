<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Statistiche Attività</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#2196f3">

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial, system-ui, sans-serif; padding: 12px; }
    input, button, select { margin: 4px; padding: 6px; font-size: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #aaa; padding: 5px 8px; vertical-align: middle; }
    th { background: #eee; }
    canvas { max-width: 100%; height: auto; }
    .tag { background: #eee; border-radius: 5px; padding: 2px 7px; margin-right: 5px; }
    .link-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 16px;
      background: #2196f3;
      color: white;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    #loading { display:none; margin:8px 0; color:#555; }
    .actions { white-space: nowrap; text-align: right; }
    .sm { padding: 6px 10px; font-size: 14px; border: none; border-radius: 6px; background: #eaeaea; cursor: pointer; }
    .sm + .sm { margin-left: 6px; }
    .sm.danger { background: #ffdddd; color: #a40000; }
    .sm.primary { background: #2196f3; color: #fff; }

    /* Overlay / modal per modifica */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.35);
      display: none; align-items: center; justify-content: center; z-index: 9999;
    }
    .overlay.show { display: flex; }
    .modal {
      width: min(520px, 92vw);
      background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    .modal h3 { margin: 0 0 8px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .modal .btns { display:flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .btns .left, .btns .right { display:flex; gap: 8px; }
  </style>
</head>
<body>
  <h2>📊 Statistiche Giornaliere</h2>
  <div id="loading">Caricamento…</div>
  <button onclick="calcolaPercentualiPerData()">Mostra Statistiche Oggi</button>
  Cambia data: <input type="date" id="statsDate">
  <div>
    <button onclick="calcolaPercentualiPerData('all')">TUTTE</button>
    <button onclick="calcolaPercentualiPerData('free')">Solo tempo gestibile</button>
  </div>

  <!-- Confronto tra due date -->
  <div style="margin-top:8px">
    Confronta: 
    <input type="date" id="cmpA"> vs <input type="date" id="cmpB">
    <button id="btnCompare">Confronta</button>
  </div>

  <div id="statsResult"></div>
  <canvas id="statsPie" width="280" height="160"></canvas>

  <hr>
  <h2>🗕️ Statistiche Settimanali</h2>
  Dal: <input type="date" id="weekStart">
  Al: <input type="date" id="weekEnd">
  <div>
    <button onclick="calcolaPercentualiSettimana('all')">TUTTE</button>
    <button onclick="calcolaPercentualiSettimana('free')">Solo tempo gestibile</button>
  </div>
  <div id="weekStatsResult"></div>
  <canvas id="weekStatsPie" width="280" height="160"></canvas>

  <hr>
  <h2>📋 Attività</h2>
  <div>
    <button id="btnLast" class="sm primary">Ultimi 5 (realtime)</button>
    <button id="btnAll"  class="sm">Mostra tutti</button>
  </div>
  <table id="activityTable">
    <thead>
      <tr><th>Data</th><th>Ora</th><th>Tag</th><th>Attività</th><th class="actions">Azioni</th></tr>
    </thead>
    <tbody id="activityList"></tbody>
  </table>

  <div style="margin-top:14px">
    <a href="index.html" class="link-btn">📥 Torna all’inserimento</a>
  </div>

  <!-- Overlay di modifica -->
  <div id="editOverlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <h3 id="editTitle">✏️ Modifica attività</h3>
      <input type="text" id="editActivity" placeholder="Attività…">
      <div class="row">
        <input type="datetime-local" id="editDateTime">
        <select id="editTag">
          <option value="">--Tag--</option>
          <option>Entertainment</option>
          <option>Survive</option>
          <option>Study</option>
          <option>Work</option>
          <option>Nut</option>
          <option>Slavery</option>
          <option>Productivity</option>
          <option>Waste</option>
          <option>Chess</option>
          <option>Gym</option>
          <option>Bike</option>
          <option>Holiday</option>
          <option>Chinese</option>
          <option>Sleep</option>
          <option>Book</option>
        </select>
      </div>
      <div class="btns">
        <div class="left">
          <button id="deleteEditBtn" class="sm danger">🗑️ Elimina</button>
        </div>
        <div class="right">
          <button id="cancelEditBtn" class="sm">Annulla</button>
          <button id="saveEditBtn" class="sm primary">Salva</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === Firebase init ===
    const firebaseConfig = {
      apiKey: "AIzaSyDEq8aUhdBPcjYM6H6909DldXAdjhRNWbI",
      authDomain: "time-ff7ed.firebaseapp.com",
      projectId: "time-ff7ed",
      storageBucket: "time-ff7ed.appspot.com",
      messagingSenderId: "842285944784",
      appId: "1:842285944784:web:de483548153abc956033d5",
      measurementId: "G-ZR0BNWGVXJ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // Offline persistence
    firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(e=>{
      console.warn('Persistence non attiva:', e.code);
    });

    const auth = firebase.auth();
    const db   = firebase.firestore();

    // === Stato ===
    const NON_LIBERI = ["Survive", "Sleep", "Work", "Slavery"];
    let statsPieChart = null, weekPieChart = null;
    let unsubLatest = null; // realtime ultimi 5
    let currentEditId = null;

    // Helpers
    const isoDayStart = d => `${d}T00:00:00`;
    const isoDayEnd   = d => `${d}T23:59:59`;
    const $ = s => document.querySelector(s);
    const loadingEl = $('#loading');
    function setLoading(on){ loadingEl.style.display = on ? 'block' : 'none'; }
    function userActivities(uid){ return db.collection(`users/${uid}/activities`); }
    function toInputDateTimeLocal(str){
      // accetta "YYYY-MM-DDTHH:mm" o "YYYY-MM-DDTHH:mm:ss"
      if (!str) return '';
      return str.length >= 16 ? str.slice(0,16) : str;
    }

    // === Auth guard + bootstrap ===
    document.addEventListener('DOMContentLoaded', () => {
      auth.onAuthStateChanged(u => {
        if (!u) { location.href = 'index.html'; return; }

        // Precompila date input (oggi e settimana corrente)
        const today = new Date().toISOString().slice(0,10);
        if (!$('#statsDate').value) $('#statsDate').value = today;

        const now = new Date();
        const day = now.getDay();
        const diffToMon = (day + 6) % 7;
        const monday = new Date(now); monday.setDate(now.getDate() - diffToMon);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
        if (!$('#weekStart').value) $('#weekStart').value = monday.toISOString().slice(0,10);
        if (!$('#weekEnd').value)   $('#weekEnd').value   = sunday.toISOString().slice(0,10);

        // Tabella: default ultimi 5 (realtime)
        renderActivitiesTable(u.uid, 'latest');

        // Bottoni lista
        $('#btnLast').onclick = () => renderActivitiesTable(u.uid, 'latest');
        $('#btnAll').onclick  = () => renderActivitiesTable(u.uid, 'all');

        // Confronto date
        $('#btnCompare').onclick = () => compareTwoDays(u.uid);

        // Overlay buttons
        $('#cancelEditBtn').onclick = closeEdit;
        $('#saveEditBtn').onclick   = saveEdit;
        $('#deleteEditBtn').onclick = () => { if (currentEditId) deleteActivity(currentEditId); };
        $('#editOverlay').addEventListener('click', (e)=>{
          if (e.target.id === 'editOverlay') closeEdit();
        });
      });
    });

    // === Tabella: Ultimi 5 (realtime) / Tutti (one-shot) con azioni ===
    function renderActivitiesTable(uid, mode='latest') {
      if (unsubLatest) { unsubLatest(); unsubLatest = null; }

      let q = userActivities(uid).orderBy("timestamp","desc");
      if (mode === 'latest') q = q.limit(5);

      const updateDOM = (snapshot) => {
        const activityList = $('#activityList');
        activityList.innerHTML = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          const dt = new Date(d.timestamp);
          const localDate = dt.toLocaleDateString('it-IT', { timeZone: 'Europe/Rome' });
          const localTime = dt.toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour12: false });
          activityList.innerHTML += `
            <tr>
              <td>${localDate}</td>
              <td>${localTime}</td>
              <td><span class="tag">${d.tag || 'Nessun tag'}</span></td>
              <td>${d.activity || ''}</td>
              <td class="actions">
                <button class="sm" onclick="openEdit('${doc.id}')">✏️</button>
                <button class="sm danger" onclick="deleteActivity('${doc.id}')">🗑️</button>
              </td>
            </tr>`;
        });
      };

      if (mode === 'latest') {
        unsubLatest = q.onSnapshot(updateDOM);
      } else {
        q.get().then(updateDOM);
      }
    }

    // === Apertura overlay modifica ===
    async function openEdit(id){
      const u = auth.currentUser; if (!u) return;
      currentEditId = id;
      try {
        const snap = await userActivities(u.uid).doc(id).get();
        if (!snap.exists) { alert('Documento inesistente.'); return; }
        const d = snap.data();
        $('#editActivity').value = d.activity || '';
        $('#editTag').value      = d.tag || '';
        $('#editDateTime').value = toInputDateTimeLocal(d.timestamp || '');
        $('#editOverlay').classList.add('show');
        $('#editOverlay').setAttribute('aria-hidden', 'false');
      } catch(e){ console.error(e); alert('Errore apertura modifica: '+e.message); }
    }
    function closeEdit(){
      currentEditId = null;
      $('#editOverlay').classList.remove('show');
      $('#editOverlay').setAttribute('aria-hidden', 'true');
    }

    // === Salvataggio modifica ===
    async function saveEdit(){
      const u = auth.currentUser; if (!u) return;
      if (!currentEditId) return;
      const activity = $('#editActivity').value.trim();
      const tag      = $('#editTag').value;
      const ts       = $('#editDateTime').value;
      if (!activity || !tag || !ts) { alert('Compila attività, tag e data/ora.'); return; }
      try {
        await userActivities(u.uid).doc(currentEditId).update({ activity, tag, timestamp: ts });
        closeEdit();
      } catch(e){ console.error(e); alert('Errore salvataggio: '+e.message); }
    }

    // === Cancellazione record (da tabella o overlay) ===
    async function deleteActivity(id){
      const u = auth.currentUser; if (!u) return;
      if (!confirm('Eliminare definitivamente questa attività?')) return;
      try {
        await userActivities(u.uid).doc(id).delete();
        if (id === currentEditId) closeEdit();
      } catch(e){ console.error(e); alert('Errore eliminazione: '+e.message); }
    }
    window.openEdit = openEdit;
    window.deleteActivity = deleteActivity;

    // === Statistiche giornaliere ===
    async function calcolaPercentualiPerData(filtro = "all") {
      const u = auth.currentUser;
      if (!u) { location.href = 'index.html'; return; }

      let dataYYYYMMDD = $('#statsDate').value || new Date().toISOString().slice(0,10);
      $('#statsDate').value = dataYYYYMMDD;

      setLoading(true);
      const snap = await userActivities(u.uid)
        .where("timestamp", ">=", isoDayStart(dataYYYYMMDD))
        .where("timestamp", "<=", isoDayEnd(dataYYYYMMDD))
        .orderBy("timestamp").get();

      const items = [];
      snap.forEach(doc => items.push({ tag: doc.data().tag, timestamp: doc.data().timestamp }));

      // Prima attività del giorno successivo
      const d = new Date(dataYYYYMMDD); d.setDate(d.getDate() + 1);
      const nextDay = d.toISOString().slice(0,10);
      const nextSnap = await userActivities(u.uid)
        .where("timestamp", ">=", isoDayStart(nextDay))
        .orderBy("timestamp").limit(1).get();
      let nextDayActivity = null; nextSnap.forEach(doc => nextDayActivity = doc.data());

      let events = [];
      if (items.length > 0) {
        events.push({ tag: items[0].tag, timestamp: isoDayStart(dataYYYYMMDD) });
        events = events.concat(items);
        const lastTime = items[items.length-1].timestamp;
        const end = isoDayEnd(dataYYYYMMDD);
        if (lastTime < end) events.push({ tag: nextDayActivity ? nextDayActivity.tag : "Sleep", timestamp: end });
        else events.push({ tag: items[items.length-1].tag, timestamp: end });
      }

      if (events.length < 2) {
        $('#statsResult').innerHTML = `<b>Statistiche del ${dataYYYYMMDD}</b><br>Nessuna attività trovata.`;
        if (statsPieChart) { statsPieChart.destroy(); statsPieChart = null; }
        setLoading(false);
        return;
      }

      let tempoPerTag = {}, totMin = 0, minNonGestibili = 0, breakdown = {};
      for (let i = 1; i < events.length; i++) {
        const t1 = new Date(events[i-1].timestamp);
        const t2 = new Date(events[i].timestamp);
        const diff = Math.round((t2 - t1) / 60000);
        if (diff <= 0) continue;
        const tag = events[i].tag;
        if (NON_LIBERI.includes(tag)) { minNonGestibili += diff; breakdown[tag] = (breakdown[tag] || 0) + diff; }
        if (!(filtro === "free" && NON_LIBERI.includes(tag))) { tempoPerTag[tag] = (tempoPerTag[tag] || 0) + diff; totMin += diff; }
      }

      let html = `<b>Statistiche del ${dataYYYYMMDD} (${filtro === 'free' ? 'solo tempo gestibile' : 'tutte le attività'})</b><br>`;
      html += `(Totale: <b>${totMin} min</b> = ${(totMin/60).toFixed(1)}h)<br>`;
      if (filtro === "free") {
        const disponibili = 1440 - minNonGestibili;
        const perc = disponibili > 0 ? ((totMin / disponibili) * 100).toFixed(1) : '0.0';
        html += `<i>Usato: ${totMin} / ${disponibili} min → <b>${perc}%</b></i><br>`;
      }
      html += `<br><b>🕒 Breakdown 24h (non gestibile):</b><ul>`;
      let totaleNG = 0;
      for (const tag of NON_LIBERI) {
        if (breakdown[tag]) { totaleNG += breakdown[tag]; html += `<li>${tag}: ${(breakdown[tag]/60).toFixed(1)}h</li>`; }
      }
      html += `<li><b>Totale non gestibile:</b> ${(totaleNG/60).toFixed(1)}h</li>`;
      html += `<li><b>Tempo teorico gestibile:</b> ${((1440 - totaleNG)/60).toFixed(1)}h</li>`;
      html += `</ul>`;

      html += `<table><tr><th>Tag</th><th>Minuti</th><th>%</th></tr>`;
      for (const [tag, min] of Object.entries(tempoPerTag)) {
        const perc = totMin > 0 ? ((min / totMin) * 100).toFixed(1) : '0.0';
        html += `<tr><td>${tag}</td><td>${min}</td><td>${perc}%</td></tr>`;
      }
      html += `</table>`;
      $('#statsResult').innerHTML = html;

      const ctx = document.getElementById('statsPie').getContext('2d');
      if (statsPieChart) statsPieChart.destroy();
      statsPieChart = new Chart(ctx, {
        type: 'pie',
        data: { labels: Object.keys(tempoPerTag), datasets: [{ data: Object.values(tempoPerTag) }] },
        options: { plugins: { legend: { display: true, position: 'right' } } }
      });

      setLoading(false);
    }
    window.calcolaPercentualiPerData = calcolaPercentualiPerData;

    // === Statistiche settimanali ===
    async function calcolaPercentualiSettimana(filtro = "all") {
      const u = auth.currentUser;
      if (!u) { location.href = 'index.html'; return; }

      let start = $('#weekStart').value;
      let end   = $('#weekEnd').value;

      if (!start || !end) {
        const now = new Date();
        const day = now.getDay();
        const diffToMon = (day + 6) % 7;
        const monday = new Date(now); monday.setDate(now.getDate() - diffToMon);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
        start = monday.toISOString().slice(0,10);
        end   = sunday.toISOString().slice(0,10);
        if (!$('#weekStart').value) $('#weekStart').value = start;
        if (!$('#weekEnd').value)   $('#weekEnd').value   = end;
      }

      async function computeDay(yyyyMmDd) {
        const snap = await userActivities(u.uid)
          .where("timestamp", ">=", isoDayStart(yyyyMmDd))
          .where("timestamp", "<=", isoDayEnd(yyyyMmDd))
          .orderBy("timestamp").get();

        const items = []; snap.forEach(doc => items.push({ tag: doc.data().tag, timestamp: doc.data().timestamp }));
        if (items.length === 0) return { tempoPerTag: {}, totMin: 0, breakdown: {}, minNonGestibili: 0 };

        const d = new Date(yyyyMmDd); d.setDate(d.getDate() + 1);
        const nextDay = d.toISOString().slice(0,10);
        const nextSnap = await userActivities(u.uid)
          .where("timestamp", ">=", isoDayStart(nextDay))
          .orderBy("timestamp").limit(1).get();
        let nextDayActivity = null; nextSnap.forEach(doc => nextDayActivity = doc.data());

        let events = [{ tag: items[0].tag, timestamp: isoDayStart(yyyyMmDd) }, ...items];
        const endStr = isoDayEnd(yyyyMmDd);
        const lastTime = items[items.length - 1].timestamp;
        if (lastTime < endStr) events.push({ tag: nextDayActivity ? nextDayActivity.tag : "Sleep", timestamp: endStr });
        else events.push({ tag: items[items.length - 1].tag, timestamp: endStr });

        let tempoPerTag = {}, totMin = 0, minNonGestibili = 0, breakdown = {};
        for (let i=1; i<events.length; i++) {
          const t1 = new Date(events[i-1].timestamp);
          const t2 = new Date(events[i].timestamp);
          const diff = Math.round((t2 - t1) / 60000);
          if (diff <= 0) continue;
          const tag = events[i].tag;

          if (NON_LIBERI.includes(tag)) { minNonGestibili += diff; breakdown[tag] = (breakdown[tag] || 0) + diff; }
          if (!(filtro === "free" && NON_LIBERI.includes(tag))) { tempoPerTag[tag] = (tempoPerTag[tag] || 0) + diff; totMin += diff; }
        }
        return { tempoPerTag, totMin, breakdown, minNonGestibili };
      }

      setLoading(true);
      // Giorni inclusivi
      const days = [];
      { const s = new Date(start), e = new Date(end);
        for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) days.push(d.toISOString().slice(0,10));
      }

      let aggTempo = {}, aggTot = 0, aggBreak = {}, aggNG = 0;
      for (const dstr of days) {
        const res = await computeDay(dstr);
        aggTot += res.totMin; aggNG += res.minNonGestibili;
        for (const [tag, min] of Object.entries(res.tempoPerTag)) aggTempo[tag] = (aggTempo[tag] || 0) + min;
        for (const [tag, min] of Object.entries(res.breakdown))   aggBreak[tag] = (aggBreak[tag] || 0) + min;
      }

      let html = `<b>Statistiche Settimanali ${start} → ${end} (${filtro === 'free' ? 'solo tempo gestibile' : 'tutte'})</b><br>`;
      html += `(Totale: <b>${aggTot} min</b> = ${(aggTot/60).toFixed(1)}h)<br>`;
      if (filtro === "free") {
        const disponibili = (days.length * 1440) - aggNG;
        const perc = disponibili > 0 ? ((aggTot / disponibili) * 100).toFixed(1) : '0.0';
        html += `<i>Usato: ${aggTot} / ${disponibili} min → <b>${perc}%</b></i><br>`;
      }
      html += `<br><b>🕒 Breakdown non gestibile (settimana):</b><ul>`;
      let totNGh = 0;
      for (const tag of NON_LIBERI) {
        if (aggBreak[tag]) { totNGh += aggBreak[tag]; html += `<li>${tag}: ${(aggBreak[tag]/60).toFixed(1)}h</li>`; }
      }
      html += `<li><b>Totale non gestibile:</b> ${(totNGh/60).toFixed(1)}h</li>`;
      html += `</ul>`;

      html += `<table><tr><th>Tag</th><th>Minuti</th><th>%</th></tr>`;
      const total = Object.values(aggTempo).reduce((a,b)=>a+b,0);
      for (const [tag, min] of Object.entries(aggTempo)) {
        const perc = total > 0 ? ((min / total) * 100).toFixed(1) : '0.0';
        html += `<tr><td>${tag}</td><td>${min}</td><td>${perc}%</td></tr>`;
      }
      html += `</table>`;
      $('#weekStatsResult').innerHTML = html;

      const ctx = document.getElementById('weekStatsPie').getContext('2d');
      if (weekPieChart) weekPieChart.destroy();
      weekPieChart = new Chart(ctx, {
        type: 'pie',
        data: { labels: Object.keys(aggTempo), datasets: [{ data: Object.values(aggTempo) }] },
        options: { plugins: { legend: { display: true, position: 'right' } } }
      });

      setLoading(false);
    }
    window.calcolaPercentualiSettimana = calcolaPercentualiSettimana;

    // === Confronto tra due date (grafico barre su canvas principale) ===
    async function compareTwoDays(uid){
      const A = $('#cmpA').value, B = $('#cmpB').value;
      if (!A || !B) { alert('Seleziona entrambe le date'); return; }

      async function dayAgg(yyyyMmDd){
        const snap = await userActivities(uid)
          .where('timestamp','>=',isoDayStart(yyyyMmDd))
          .where('timestamp','<=',isoDayEnd(yyyyMmDd))
          .orderBy('timestamp').get();
        const items=[]; snap.forEach(d=>items.push(d.data()));
        if (!items.length) return {};
        const ev=[{tag:items[0].tag,timestamp:isoDayStart(yyyyMmDd)},...items,{tag:items[items.length-1].tag,timestamp:isoDayEnd(yyyyMmDd)}];
        const out={}; for (let i=1;i<ev.length;i++){ const diff=(new Date(ev[i].timestamp)-new Date(ev[i-1].timestamp))/60000; if(diff>0) out[ev[i].tag]=(out[ev[i].tag]||0)+diff; }
        return out;
      }

      setLoading(true);
      const aggA = await dayAgg(A);
      const aggB = await dayAgg(B);
      const labels = Array.from(new Set([...Object.keys(aggA),...Object.keys(aggB)]));

      const ctx = document.getElementById('statsPie').getContext('2d');
      if (statsPieChart) statsPieChart.destroy();
      statsPieChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: A, data: labels.map(l=>aggA[l]||0) },
            { label: B, data: labels.map(l=>aggB[l]||0) }
          ]
        },
        options: { responsive:true, plugins:{ legend:{ position:'right' } } }
      });
      setLoading(false);
    }

    // === Service Worker ===
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ Service Worker registrato'))
        .catch(err => console.error('❌ SW errore:', err));
    }
  </script>
</body>
