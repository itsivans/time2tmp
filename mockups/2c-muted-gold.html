<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Mockup 2C: Muted Gold</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ===== BRAND: Muted Gold (Earthy, Elegant) ===== */
    :root {
      --brand: #a68a5b;
      --brand-light: #f5f1ea;
      --brand-dark: #8b7355;
      --accent: #c4a97d;

      --bg: #fafaf8;
      --text: #2c2c2c;
      --muted: #777;
      --card: #ffffff;
      --border: #e5e0d8;
      --toast: #2c2c2c;
      --toastText: #fff;
    }

    [data-theme="dark"] {
      --bg: #18171a;
      --text: #e8e6e3;
      --muted: #999;
      --card: #222024;
      --border: #3a3838;
      --brand-light: #2a2620;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }

    .container { max-width: 500px; margin: 0 auto; }

    .badge {
      display: inline-block;
      background: var(--brand);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--brand);
    }

    h3 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }

    /* ===== TIME REMAINING BAR ===== */
    .time-remaining {
      background: var(--brand-light);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .time-remaining .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .time-remaining .time {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--brand);
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .time-remaining .percent {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ===== ADD BUTTON ===== */
    .addBtn {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .addBtn:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }
    .addBtn:active {
      transform: translateY(0);
    }

    /* ===== STATS BUTTON ===== */
    .statsBtn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid var(--brand);
      border-radius: 10px;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .statsBtn:hover {
      background: var(--brand);
      color: white;
    }

    .muted { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">
    Toggle Dark
  </button>

  <div class="container">
    <div class="badge">MOCKUP 2C: MUTED GOLD</div>

    <div class="card">
      <h3>Inserisci attivita</h3>

      <input type="text" placeholder="Cosa stai facendo...">

      <div class="row">
        <input type="datetime-local" value="2026-02-03T16:30">
        <select>
          <option>--Tag--</option>
          <option>Lavoro</option>
          <option>Studio</option>
          <option>Sport</option>
        </select>
      </div>

      <!-- TIME REMAINING -->
      <div class="time-remaining">
        <div class="label">Tempo rimanente</div>
        <div class="time" id="timeLeft">7h 28m</div>
        <div class="progress-bar">
          <div class="fill" id="progressFill" style="width: 69%"></div>
        </div>
        <div class="percent" id="percentText">69% completato</div>
      </div>

      <button class="addBtn">Aggiungi</button>

      <p class="muted">Ultimo: Studio alle 15:30</p>
    </div>

    <button class="statsBtn">Statistiche</button>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const endOfDay = new Date(now);
      endOfDay.setHours(23, 59, 59, 999);

      const remaining = endOfDay - now;
      const hours = Math.floor(remaining / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));

      const startOfDay = new Date(now);
      startOfDay.setHours(0, 0, 0, 0);
      const totalDay = 24 * 60 * 60 * 1000;
      const elapsed = now - startOfDay;
      const percent = Math.round((elapsed / totalDay) * 100);

      document.getElementById('timeLeft').textContent = `${hours}h ${minutes}m`;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('percentText').textContent = `${percent}% completato`;
    }
    updateTime();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
