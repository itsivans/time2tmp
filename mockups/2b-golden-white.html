<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Mockup 2B: Golden White</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ===== BRAND: Golden White ===== */
    :root {
      --brand: #d4a012;
      --brand-light: #fdf8e8;
      --brand-dark: #b8860b;
      --accent: #f0c850;
      --accent2: #e6b800;
      --gold-shine: linear-gradient(135deg, #d4a012, #f0c850, #b8860b);

      --bg: #fefefe;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --card: #ffffff;
      --border: #e8e4d9;
      --toast: #1a1a1a;
      --toastText: #fff;
    }

    [data-theme="dark"] {
      --bg: #121210;
      --text: #f5f3eb;
      --muted: #a0a0a0;
      --card: #1c1b18;
      --border: #2e2c26;
      --brand-light: #2a2518;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }

    .container { max-width: 500px; margin: 0 auto; }

    .badge {
      display: inline-block;
      background: var(--gold-shine);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 25px rgba(212, 160, 18, 0.08);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--gold-shine);
    }

    h3 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 12px;
      transition: all 0.25s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-light);
      transform: scale(1.01);
    }

    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }

    /* ===== TIME REMAINING BAR (Golden style) ===== */
    .time-remaining {
      background: linear-gradient(135deg, var(--brand-light), #fffef5);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: center;
      border: 1px solid rgba(212, 160, 18, 0.25);
    }
    [data-theme="dark"] .time-remaining {
      background: linear-gradient(135deg, var(--brand-light), #1a1812);
    }
    .time-remaining .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .time-remaining .time {
      font-size: 32px;
      font-weight: 800;
      background: var(--gold-shine);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 12px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--gold-shine);
      border-radius: 99px;
      transition: width 0.5s ease;
      position: relative;
    }
    .progress-bar .fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
    }
    .time-remaining .percent {
      font-size: 12px;
      color: var(--brand-dark);
      margin-top: 8px;
      font-weight: 600;
    }

    /* ===== ADD BUTTON (Golden gradient with shimmer) ===== */
    .addBtn {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: var(--gold-shine);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(212, 160, 18, 0.35);
      position: relative;
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .addBtn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s;
    }
    .addBtn:hover::before {
      left: 100%;
    }
    .addBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(212, 160, 18, 0.45);
    }
    .addBtn:active {
      transform: translateY(-1px);
    }

    /* ===== STATS BUTTON ===== */
    .statsBtn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid var(--brand);
      border-radius: 14px;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
      transition: all 0.25s;
    }
    .statsBtn:hover {
      background: var(--gold-shine);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .muted { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">
    Toggle Dark
  </button>

  <div class="container">
    <div class="badge">MOCKUP 2B: GOLDEN WHITE</div>

    <div class="card">
      <h3>Inserisci attivita</h3>

      <input type="text" placeholder="Cosa stai facendo...">

      <div class="row">
        <input type="datetime-local" value="2026-02-03T16:30">
        <select>
          <option>--Tag--</option>
          <option>Lavoro</option>
          <option>Studio</option>
          <option>Sport</option>
        </select>
      </div>

      <!-- TIME REMAINING -->
      <div class="time-remaining">
        <div class="label">Tempo rimanente</div>
        <div class="time" id="timeLeft">7h 28m</div>
        <div class="progress-bar">
          <div class="fill" id="progressFill" style="width: 69%"></div>
        </div>
        <div class="percent" id="percentText">69% completato</div>
      </div>

      <button class="addBtn">Aggiungi Attivita</button>

      <p class="muted">Ultimo inserimento: Studio alle 15:30</p>
    </div>

    <button class="statsBtn">Vai alle statistiche</button>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const endOfDay = new Date(now);
      endOfDay.setHours(23, 59, 59, 999);

      const remaining = endOfDay - now;
      const hours = Math.floor(remaining / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));

      const startOfDay = new Date(now);
      startOfDay.setHours(0, 0, 0, 0);
      const totalDay = 24 * 60 * 60 * 1000;
      const elapsed = now - startOfDay;
      const percent = Math.round((elapsed / totalDay) * 100);

      document.getElementById('timeLeft').textContent = `${hours}h ${minutes}m`;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('percentText').textContent = `${percent}% completato`;
    }
    updateTime();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
