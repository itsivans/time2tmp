<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Time Tracker — Backup (modular)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial; margin: 20px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
    input, button { padding:10px; font-size:15px; }
    button { cursor:pointer; }
    .primary { background:#1e88e5; color:#fff; border:none; border-radius:6px; }
    .secondary { background:#eee; border:1px solid #ccc; border-radius:6px; }
    #log { white-space:pre-wrap; font-size:13px; background:#fafafa; border:1px solid #eee; padding:10px; border-radius:8px; }
    small.mono { font-family: ui-monospace, Menlo, Consolas, monospace; color:#555; }
  </style>
</head>
<body>
  <h1>🧰 Backup dati — Time Tracker</h1>
  <p>Strumento separato per esportare i dati da Firestore. Se i bottoni non fanno nulla, guarda il log qui sotto.</p>

  <h3>Debug</h3>
  <div class="row">
    <button id="btnPing" class="secondary">Ping</button>
    <span id="sdkInfo"></span>
  </div>

  <h3>1) Accesso</h3>
  <div class="row">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="btnSignIn" class="secondary">Accedi</button>
    <button id="btnSignUp" class="secondary">Registrati</button>
    <button id="btnReset" class="secondary">Reset password</button>
    <button id="btnAnon" class="secondary" title="Richiede Anonymous abilitato">Accedi ospite</button>
    <button id="btnOut" class="secondary" hidden>Esci</button>
  </div>
  <div class="row">
    <strong>Utente:</strong> <span id="userInfo">Non autenticato</span>
  </div>

  <h3>2) Esporta</h3>
  <div class="row">
    <button id="btnExportLegacy" class="secondary" title="Collezioni root (compatibilità)">Export legacy</button>
    <button id="btnExportUser" class="secondary" title="Dati sotto users/{uid}/… (richiede login)">Export mio spazio utente</button>
    <button id="btnExportAll" class="primary" title="Legacy + users/{uid}/… in un file">Export TUTTO</button>
  </div>
  <p><small class="mono">Collezioni incluse: <span id="colsLabel"></span></small></p>

  <h3>Log</h3>
  <pre id="log"></pre>

  <script type="module">
    // ======== Import SDK (modulare) ========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getAuth, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      sendPasswordResetEmail, signOut, signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ======== Config ========
    const firebaseConfig = {
      apiKey: "AIzaSyDEq8aUhdBPcjYM6H6909DldXAdjhRNWbI",
      authDomain: "time-ff7ed.firebaseapp.com",
      projectId: "time-ff7ed",
      storageBucket: "time-ff7ed.appspot.com",
      messagingSenderId: "842285944784",
      appId: "1:842285944784:web:de483548153abc956033d5",
      measurementId: "G-ZR0BNWGVXJ"
    };

    // Collezioni che vuoi esportare
    const COLLECTIONS = ["activities","entries","tags"];

    // ======== Helpers UI / Log ========
    const $ = (id)=>document.getElementById(id);
    const log = (m)=>{ $("log").textContent += m + "\n"; console.log(m); };
    $("colsLabel").textContent = COLLECTIONS.join(", ");

    // Logga qualsiasi errore JS a schermo
    window.onerror = (msg, src, line, col, err) => {
      log("❌ JS error: " + msg + " @ " + src + ":" + line + ":" + col);
      if (err && err.stack) log(err.stack);
    };
    window.onunhandledrejection = (e) => {
      log("❌ Unhandled promise: " + (e.reason?.message || e.reason || e));
    };

    // ======== Init Firebase ========
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const auth = getAuth(app);
    $("sdkInfo").textContent = "SDK ok";

    // ======== Core functions ========
    async function dumpCollection(colRef) {
      const snap = await getDocs(colRef);
      return snap.docs.map(d => ({ id: d.id, data: d.data() }));
    }
    function downloadJSON(filename, obj) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(a.href);
    }
    const ts = () => new Date().toISOString().replace(/[:.]/g,"-");

    // ======== Auth actions ========
    async function signInEmail() {
      const email = $("email").value.trim();
      const password = $("password").value;
      await signInWithEmailAndPassword(auth, email, password);
      log("✅ Login eseguito.");
    }
    async function signUpEmail() {
      const email = $("email").value.trim();
      const password = $("password").value;
      await createUserWithEmailAndPassword(auth, email, password);
      log("✅ Registrazione completata.");
    }
    async function resetPassword() {
      const email = $("email").value.trim();
      if (!email) throw new Error("Inserisci l'email per il reset.");
      await sendPasswordResetEmail(auth, email);
      log("📧 Email di reset inviata.");
    }
    function signOutAll() {
      return signOut(auth).then(()=>log("🚪 Logout eseguito."));
    }
    async function signInGuest() {
      await signInAnonymously(auth);
      log("👤 Login ospite eseguito.");
    }

    onAuthStateChanged(auth, (user) => {
      $("btnOut").hidden = !user;
      $("userInfo").textContent = user
        ? (user.isAnonymous ? "Ospite (uid: "+user.uid+")" : (user.email || user.uid))
        : "Non autenticato";
    });

    // ======== Export actions ========
    async function exportLegacy() {
      log("== Export legacy ==");
      const out = { meta: { exportedAt: new Date().toISOString(), scope: "legacy", collections: COLLECTIONS }, docs: {} };
      for (const name of COLLECTIONS) {
        try {
          const arr = await dumpCollection(collection(db, name));
          out.docs[name] = arr;
          log(`• ${name}: ${arr.length} doc`);
        } catch (e) {
          log(`❌ ${name}: ${e.message||e}`);
          log("Suggerimento: controlla le Firestore Rules (serve allow read per utenti autenticati o pubblico).");
          throw e;
        }
      }
      const file = `tt-backup-legacy-${ts()}.json`;
      downloadJSON(file, out);
      log("✅ Export legacy completato → " + file);
    }

    async function exportUser() {
      const u = auth.currentUser;
      if (!u || u.isAnonymous) throw new Error("Devi essere loggato (Email/Password) per esportare lo spazio utente.");
      log(`== Export spazio utente (${u.uid}) ==`);
      const out = { meta: { exportedAt: new Date().toISOString(), scope: `user:${u.uid}`, collections: COLLECTIONS }, docs: {} };
      for (const name of COLLECTIONS) {
        const arr = await dumpCollection(collection(db, `users/${u.uid}/${name}`));
        out.docs[name] = arr;
        log(`• ${name}: ${arr.length} doc`);
      }
      const file = `tt-backup-user-${u.uid}-${ts()}.json`;
      downloadJSON(file, out);
      log("✅ Export user completato → " + file);
    }

    async function exportAll() {
      const u = auth.currentUser;
      log("== Export TUTTO ==");
      const out = {
        meta: {
          exportedAt: new Date().toISOString(),
          includesUserScope: !!(u && !u.isAnonymous),
          userUid: (u && !u.isAnonymous) ? u.uid : null,
          collections: COLLECTIONS
        },
        legacy: {}, user: null
      };

      // Legacy
      for (const name of COLLECTIONS) {
        try {
          const arr = await dumpCollection(collection(db, name));
          out.legacy[name] = arr;
          log(`• legacy/${name}: ${arr.length} doc`);
        } catch (e) {
          log(`⚠️ legacy/${name}: ${e.message||e}`);
          log("Nota: se le rules bloccano, l'export legacy può fallire. Procedo comunque.");
          out.legacy[name] = { error: String(e) };
        }
      }

      // User (se loggato non anonimo)
      if (u && !u.isAnonymous) {
        out.user = { uid: u.uid, docs: {} };
        for (const name of COLLECTIONS) {
          try {
            const arr = await dumpCollection(collection(db, `users/${u.uid}/${name}`));
            out.user.docs[name] = arr;
            log(`• user/${u.uid}/${name}: ${arr.length} doc`);
          } catch (e) {
            log(`⚠️ user/${u.uid}/${name}: ${e.message||e}`);
            out.user.docs[name] = { error: String(e) };
          }
        }
      } else {
        log("ℹ️ Non autenticato con email/password: salto export user.");
      }

      const file = `tt-backup-all-${out.meta.userUid || "noauth"}-${ts()}.json`;
      downloadJSON(file, out);
      log("✅ Export TUTTO completato → " + file);
    }

    // ======== Wire up UI events ========
    function bind(id, fn) {
      const el = $(id);
      if (!el) { log(`❌ Manca elemento #${id}`); return; }
      el.addEventListener("click", async () => {
        try { await fn(); }
        catch (e) { log(`❌ ${id}: ${e?.message || e}`); }
      });
    }

    // Ping (verifica runtime + Firestore)
    bind("btnPing", async () => {
      log("🟢 Ping ok.");
      log("Auth currentUser: " + (auth.currentUser ? (auth.currentUser.email || auth.currentUser.uid) : "null"));
      try {
        await getDocs(collection(db, "_non_esiste_per_test_"));
        log("Firestore getDocs eseguito (collezione di test).");
      } catch (e) {
        log("Firestore operativo. (Errore atteso: la collezione non esiste)");
      }
      log("Suggerimento: apri questo file via http:// (non file://). Es. `npx serve` o `python -m http.server`");
    });

    // Auth
    bind("btnSignIn",  signInEmail);
    bind("btnSignUp",  signUpEmail);
    bind("btnReset",   resetPassword);
    bind("btnAnon",    signInGuest);
    bind("btnOut",     signOutAll);

    // Export
    bind("btnExportLegacy", exportLegacy);
    bind("btnExportUser",   exportUser);
    bind("btnExportAll",    exportAll);
  </script>
</body>
</html>
